name: Angel One Daily Predictor Update

on:
  schedule:
    # Run twice a day (e.g., at 10:00 UTC and 16:00 UTC which is 3:30 PM and 9:30 PM IST)
    - cron: '0 10,16 * * 1-5' # Mon-Fri
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  run-predictions:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyotp python-dotenv logzero
          pip install smartapi-python

      - name: Run Prediction Engine
        env:
          ANGEL_USER_ID: ${{ secrets.ANGEL_USER_ID }}
          ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
        run: |
          # Inject secrets into a temporary .env file for the script to read
          echo "ANGEL_USER_ID=$ANGEL_USER_ID" > .env
          echo "ANGEL_PIN=$ANGEL_PIN" >> .env
          echo "ANGEL_API_KEY=$ANGEL_API_KEY" >> .env
          echo "ANGEL_TOTP_SECRET=$ANGEL_TOTP_SECRET" >> .env
          
          # Move .env to project root where the script expects it
          cp .env quant_engine/.env || true
          
          # Run the engine
          python quant_engine/generate_json.py

      - name: Commit and Push Updated Predictions
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/daily_predictions.json
          git commit -m "🤖 auto-update: daily market predictions via Angel One" || echo "No changes to commit"
          git push origin main
